<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>York Jazz Fest — 1–4 October 2026</title>
<meta name="description" content="Every gig at York Jazz Fest 2026. Four days, four venues, one city. Tickets on sale now.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------
     York Jazz Fest brand.
     Colours sampled directly from the BLKHAT Studio brand PDF.
     Type: Archivo (Google Fonts, matches the brand guidelines).
     Headline face is Gambarino per the guidelines — it's a licensed
     Pangram Pangram font, so drop the webfont files in and it will be
     used automatically. Until then it falls back to Instrument Serif.
     --------------------------------------------------------------- */

  :root{
    --dark:#3C3835;          /* brand dark      */
    --dark-lift:#4A4541;     /* row hover       */
    --ink:#241F1B;           /* text on colour  */
    --cream:#E9E6D8;         /* brand cream     */
    --cream-dim:#B3AE9E;
    --tan:#AB7D4C;
    --blue:#609ECE;
    --orange:#E68F3A;
    --pink:#F546A7;
    --green:#3DA13D;
    --yellow:#EDB210;
    --rule:#5A544F;
  }

  @font-face{
    font-family:"Gambarino";
    src:url("fonts/Gambarino-Regular.woff2") format("woff2");
    font-display:swap;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--dark);
    color:var(--cream);
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    font-size:17px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .serif{font-family:"Gambarino","Instrument Serif",Georgia,serif;font-weight:400}

  .wrap{max-width:1040px;margin:0 auto;padding:0 24px}

  /* ---------- Hero ---------- */
  header{padding:48px 0 44px}
  .hero{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:44px;align-items:start}
  .poster{width:100%;height:auto;display:block;border:1px solid var(--rule)}
  .eyebrow{
    font-size:13px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--tan);
    margin-bottom:16px;
  }
  h1{
    font-family:"Gambarino","Instrument Serif",Georgia,serif;
    font-weight:400;
    font-size:clamp(52px,7.5vw,86px);
    line-height:.94;
    letter-spacing:-.01em;
    margin-bottom:6px;
  }
  .dates{
    font-size:clamp(19px,2.6vw,24px);
    font-weight:600;
    color:var(--yellow);
    margin-bottom:24px;
  }
  .intro{max-width:52ch;font-size:18px;color:var(--cream)}
  .pull{
    font-family:"Gambarino","Instrument Serif",Georgia,serif;
    font-size:clamp(22px,3.4vw,30px);
    line-height:1.2;
    color:var(--tan);
    border-left:3px solid var(--tan);
    padding-left:18px;
    margin-top:28px;
    max-width:34ch;
  }

  /* ---------- Venue key ---------- */
  .key{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}

  /* ---------- Day sections ---------- */
  .day{padding:44px 0 4px;border-top:2px solid var(--cream)}
  .day:first-child{border-top-width:2px}
  .day-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .day-name{
    font-family:"Gambarino","Instrument Serif",Georgia,serif;
    font-size:clamp(30px,5vw,46px);
    line-height:1;
  }
  .day-count{
    font-size:13px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--cream-dim);
  }

  /* ---------- Running order ---------- */
  .row{
    display:grid;
    grid-template-columns:92px 1fr auto;
    gap:22px;
    align-items:center;
    width:100%;
    text-align:left;
    background:none;
    border:0;
    border-top:1px solid var(--rule);
    padding:20px 10px 20px 0;
    cursor:pointer;
    color:inherit;
    font:inherit;
    transition:background .14s ease,padding .14s ease;
  }
  .row:last-child{border-bottom:1px solid var(--rule)}
  .row:focus-visible{
    background:var(--dark-lift);
    padding-left:14px;padding-right:20px;
    outline:none;
  }
  .row:focus-visible .act{color:var(--yellow)}
  /* Mouse only — stops the highlight sticking after a tap on touchscreens. */
  @media (hover:hover) and (pointer:fine){
    .row:hover{
      background:var(--dark-lift);
      padding-left:14px;padding-right:20px;
    }
    .row:hover .act{color:var(--yellow)}
  }

  .time{font-size:16px;font-weight:600;color:var(--tan);letter-spacing:.02em}
  .act{
    font-family:"Gambarino","Instrument Serif",Georgia,serif;
    font-size:clamp(25px,3.8vw,36px);
    line-height:1.04;
    transition:color .14s ease;
  }
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--cream-dim)}
  .chip{
    display:inline-block;
    padding:3px 10px;
    border-radius:2px;
    background:var(--tan);
    color:var(--ink);
    font-size:11px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;
    white-space:nowrap;
  }
  .price{font-size:16px;font-weight:600;white-space:nowrap;color:var(--cream)}
  .soon{
    font-size:11px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--cream-dim);
  }
  .free-tag{
    font-size:12px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink);
    background:var(--green);padding:5px 11px;border-radius:2px;
    white-space:nowrap;
  }
  .free-note{
    display:block;width:100%;text-align:center;
    border:2px solid var(--green);color:var(--green);
    font-size:17px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;
    padding:17px;
  }

  /* ---------- Detail panel ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(18,16,14,.86);
    display:none;align-items:flex-start;justify-content:center;
    padding:24px;overflow-y:auto;z-index:50;
  }
  .overlay.open{display:flex}
  .panel{
    background:var(--dark);
    width:100%;max-width:620px;margin:auto;
    border:2px solid var(--cream);
    position:relative;
  }
  .panel-photo{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-bottom:2px solid var(--cream)}
  .panel-placeholder{
    width:100%;aspect-ratio:16/9;
    display:flex;align-items:center;justify-content:center;
    border-bottom:2px solid var(--cream);
    font-family:"Gambarino","Instrument Serif",Georgia,serif;
    font-size:clamp(46px,10vw,86px);
    color:var(--ink);
  }
  .panel-body{padding:28px}
  .panel h2{
    font-family:"Gambarino","Instrument Serif",Georgia,serif;
    font-weight:400;
    font-size:clamp(32px,6vw,46px);
    line-height:1;
    margin-bottom:16px;
  }
  .panel-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .fact{font-size:13px;font-weight:600;padding:5px 11px;border:1px solid var(--rule);color:var(--cream)}
  .panel-blurb{font-size:17px;white-space:pre-line;margin-bottom:22px}
  .panel-blurb.empty{color:var(--cream-dim)}
  .artist-link{
    display:inline-block;font-weight:600;color:var(--blue);
    text-decoration:underline;text-underline-offset:3px;margin-bottom:24px;
  }
  .buy{
    display:block;width:100%;
    background:var(--yellow);color:var(--ink);
    text-align:center;text-decoration:none;
    font-size:19px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;
    padding:18px;border:2px solid var(--yellow);
  }
  .buy:focus-visible{background:transparent;color:var(--yellow)}
  @media (hover:hover) and (pointer:fine){
    .buy:hover{background:transparent;color:var(--yellow)}
  }
  .buy.disabled{
    background:transparent;color:var(--cream-dim);
    border-color:var(--rule);cursor:default;
    font-size:15px;letter-spacing:.06em;
  }
  .buy-note{text-align:center;font-size:13px;color:var(--cream-dim);margin-top:10px}
  .close{
    position:absolute;top:-2px;right:-2px;
    width:46px;height:46px;
    background:var(--cream);color:var(--ink);
    border:0;cursor:pointer;font-size:21px;line-height:1;
  }
  .close:focus-visible{background:var(--yellow)}
  @media (hover:hover) and (pointer:fine){
    .close:hover{background:var(--yellow)}
  }

  /* ---------- Footer ---------- */
  footer{
    margin-top:52px;border-top:2px solid var(--cream);
    padding:28px 0 72px;font-size:15px;color:var(--cream-dim);
  }
  footer a{color:var(--blue);font-weight:600}

  :focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

  @media (max-width:760px){
    .hero{grid-template-columns:1fr;gap:28px}
    .poster{max-width:340px}
  }
  @media (max-width:560px){
    .row{grid-template-columns:66px 1fr;gap:14px;row-gap:8px}
    .price,.soon{grid-column:2;justify-self:start}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="hero">
      <img class="poster" id="poster" src="poster.jpg" alt="York Jazz Fest 2026 poster">
      <div>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title"></h1>
        <div class="dates" id="dates"></div>
        <p class="intro" id="intro"></p>
        <p class="pull" id="pull"></p>
      </div>
    </div>
    <div class="key" id="key"></div>
  </header>

  <main id="listings"></main>

  <footer>
    <p>All tickets sold through See Tickets. <a id="promoter" href="#">See every event on our See Tickets page →</a></p>
  </footer>

</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div class="panel">
    <button class="close" id="close" aria-label="Close">&#10005;</button>
    <div id="panel-visual"></div>
    <div class="panel-body">
      <h2 id="panel-title"></h2>
      <div class="panel-meta" id="panel-meta"></div>
      <p class="panel-blurb" id="panel-blurb"></p>
      <div id="panel-artist"></div>
      <div id="panel-buy"></div>
    </div>
  </div>
</div>

<script src="events.js"></script>
<script>
(function () {
  "use strict";

  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function venueOf(ev){
    return VENUES[ev.venue] || { name: ev.venue, colour: "#AB7D4C" };
  }

  function doorsFor(start){
    var p = start.split(":");
    var m = (+p[0]) * 60 + (+p[1]) - 30;
    if (m < 0) m += 1440;
    return String(Math.floor(m / 60)).padStart(2, "0") + ":" +
           String(m % 60).padStart(2, "0");
  }

  function longDate(iso){
    var p = iso.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
  }

  function ticketLink(ev){
    if (!ev.ticketUrl) return "";
    var sep = ev.ticketUrl.indexOf("?") === -1 ? "?" : "&";
    return ev.ticketUrl + sep + "src=" + encodeURIComponent(CONFIG.trackingSource);
  }

  function priceLabel(ev){
    if (ev.price === null || ev.price === undefined) return "";
    return "\u00A3" + Number(ev.price).toFixed(2).replace(/\.00$/, "");
  }

  /* ---------- Hero ---------- */
  document.title = CONFIG.festivalName + " \u2014 " + CONFIG.dates;
  document.getElementById("eyebrow").textContent = CONFIG.city;
  document.getElementById("title").textContent = CONFIG.festivalName;
  document.getElementById("dates").textContent = CONFIG.dates;
  document.getElementById("intro").textContent = CONFIG.intro;
  document.getElementById("pull").textContent = CONFIG.pullQuote || "";
  document.getElementById("promoter").href = CONFIG.promoterUrl;
  if (CONFIG.poster) document.getElementById("poster").src = CONFIG.poster;

  var keyEl = document.getElementById("key");
  Object.keys(VENUES).forEach(function(k){
    var v = VENUES[k];
    var chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = v.colour;
    chip.textContent = v.name;
    keyEl.appendChild(chip);
  });

  /* ---------- Group by day ---------- */
  var sorted = EVENTS.slice().sort(function(a,b){
    return (a.date + a.start).localeCompare(b.date + b.start);
  });

  var byDay = [];
  sorted.forEach(function(ev){
    var last = byDay[byDay.length - 1];
    if (!last || last.date !== ev.date) byDay.push({ date: ev.date, items: [ev] });
    else last.items.push(ev);
  });

  var listings = document.getElementById("listings");

  byDay.forEach(function(day){
    var sec = document.createElement("section");
    sec.className = "day";

    var head = document.createElement("div");
    head.className = "day-head";
    head.innerHTML =
      '<span class="day-name">' + esc(longDate(day.date)) + "</span>" +
      '<span class="day-count">' + day.items.length +
      (day.items.length === 1 ? " show" : " shows") + "</span>";
    sec.appendChild(head);

    day.items.forEach(function(ev){
      var v = venueOf(ev);
      var btn = document.createElement("button");
      btn.className = "row";
      btn.type = "button";
      btn.innerHTML =
        '<span class="time">' + esc(ev.start) + "</span>" +
        "<span>" +
          '<span class="act">' + esc(ev.act) + "</span>" +
          '<span class="meta">' +
            '<span class="chip" style="background:' + esc(v.colour) + '">' + esc(v.name) + "</span>" +
            "<span>" + (ev.free
                ? (ev.end ? "Until " + esc(ev.end) : "No ticket needed")
                : "Doors " + esc(doorsFor(ev.start))) + "</span>" +
          "</span>" +
        "</span>" +
        (ev.free
          ? '<span class="free-tag">Free</span>'
          : '<span class="' + (ev.onSale && ev.ticketUrl ? "price" : "soon") + '">' +
            (ev.onSale && ev.ticketUrl
              ? esc(priceLabel(ev) || "Tickets")
              : "Coming soon") +
            "</span>");
      btn.addEventListener("click", function(){ openPanel(ev); });
      sec.appendChild(btn);
    });

    listings.appendChild(sec);
  });

  /* ---------- Detail panel ---------- */
  var overlay  = document.getElementById("overlay");
  var visual   = document.getElementById("panel-visual");
  var titleEl  = document.getElementById("panel-title");
  var metaEl   = document.getElementById("panel-meta");
  var blurbEl  = document.getElementById("panel-blurb");
  var artistEl = document.getElementById("panel-artist");
  var buyEl    = document.getElementById("panel-buy");
  var lastFocus = null;

  function openPanel(ev){
    var v = venueOf(ev);
    lastFocus = document.activeElement;

    if (ev.photo) {
      visual.innerHTML = '<img class="panel-photo" src="' + esc(ev.photo) +
                         '" alt="' + esc(ev.act) + '">';
    } else {
      var initials = ev.act.split(/\s+/).slice(0,2)
                       .map(function(w){ return w.charAt(0); }).join("");
      visual.innerHTML = '<div class="panel-placeholder" style="background:' +
                         esc(v.colour) + '">' + esc(initials) + "</div>";
    }

    titleEl.textContent = ev.act;

    var facts = [longDate(ev.date)];
    if (ev.free) {
      facts.push(ev.end ? ev.start + "\u2013" + ev.end : ev.start);
      facts.push(v.name);
      facts.push("Free entry");
    } else {
      facts.push(ev.start + " (doors " + doorsFor(ev.start) + ")");
      facts.push(v.name);
      var p = priceLabel(ev);
      if (p) facts.push(p + " + booking fee");
    }
    metaEl.innerHTML = facts.map(function(f){
      return '<span class="fact">' + esc(f) + "</span>";
    }).join("");

    if (ev.blurb) {
      blurbEl.textContent = ev.blurb;
      blurbEl.className = "panel-blurb";
    } else {
      blurbEl.textContent = "Full line-up details and set times on the ticket page.";
      blurbEl.className = "panel-blurb empty";
    }

    artistEl.innerHTML = ev.artistUrl
      ? '<a class="artist-link" href="' + esc(ev.artistUrl) +
        '" target="_blank" rel="noopener">More about ' + esc(ev.act) + " \u2192</a>"
      : "";

    var link = ticketLink(ev);
    if (ev.free) {
      buyEl.innerHTML = '<span class="free-note">Free entry</span>' +
                        '<p class="buy-note">No ticket needed \u2014 just turn up.</p>';
    } else if (ev.onSale && link) {
      buyEl.innerHTML = '<a class="buy" href="' + esc(link) +
                        '" target="_blank" rel="noopener">Buy tickets</a>';
    } else {
      buyEl.innerHTML = '<span class="buy disabled">Tickets not on sale yet</span>' +
                        '<p class="buy-note">Check back soon, or see the full listing on See Tickets.</p>';
    }

    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
    document.getElementById("close").focus();
  }

  function closePanel(){
    overlay.classList.remove("open");
    document.body.style.overflow = "";
    if (lastFocus) lastFocus.focus();
  }

  document.getElementById("close").addEventListener("click", closePanel);
  overlay.addEventListener("click", function(e){
    if (e.target === overlay) closePanel();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && overlay.classList.contains("open")) closePanel();
  });
})();
</script>
</body>
</html>
